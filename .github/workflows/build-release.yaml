name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore cached KataGo engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine-cache/libkatago.so
          key: katago-v1.15.3-eigen-arm64-v1

      - name: Checkout KataGo v1.15.3
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: v1.15.3
          path: katago-src

      - name: Install Eigen headers
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Build KataGo engine for Android arm64
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          EIGEN_DIR=$(dirname "$(find /usr -name 'Eigen3Config.cmake' | head -1)")
          cd katago-src/cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_BACKEND=EIGEN \
            -DUSE_OPENSSL=OFF \
            -DNO_GIT_REVISION=ON \
            -DCMAKE_C_FLAGS="-DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DCMAKE_CXX_FLAGS="-DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DEigen3_DIR="$EIGEN_DIR"
          cmake --build build-android -j"$(nproc)"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" build-android/katago
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp build-android/katago "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkatago.so"
          mkdir -p "$GITHUB_WORKSPACE/engine-cache"
          cp build-android/katago "$GITHUB_WORKSPACE/engine-cache/libkatago.so"

      - name: Place cached engine binary
        if: steps.engine-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp engine-cache/libkatago.so app/src/main/jniLibs/arm64-v8a/libkatago.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Fetch bundled models (light b10c128, human SL; the strong b18 model is an in-app download, not bundled)
        run: |
          cd "$RUNNER_TEMP"
          curl -sL -o default.txt.gz "https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b10c128-s1141046784-d204142634.txt.gz"
          ls -la default.txt.gz
          file default.txt.gz
          gzip -t default.txt.gz
          curl -sL -o human.bin.gz "https://github.com/lightvector/KataGo/releases/download/v1.15.0/b18c384nbt-humanv0.bin.gz"
          ls -la human.bin.gz
          gzip -t human.bin.gz
          test "$(stat -c%s human.bin.gz)" = "99066230"
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/models"
          cp default.txt.gz "$GITHUB_WORKSPACE/app/src/main/assets/models/default.model"
          cp human.bin.gz "$GITHUB_WORKSPACE/app/src/main/assets/models/human.model"

      - name: Restore signing keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.TUXUNGO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::TUXUNGO_KEYSTORE_BASE64 secret is missing; cannot sign the release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ls -la "$RUNNER_TEMP/release.keystore"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          TUXUNGO_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          TUXUNGO_STORE_PASSWORD: ${{ secrets.TUXUNGO_STORE_PASSWORD }}
          TUXUNGO_KEY_ALIAS: ${{ secrets.TUXUNGO_KEY_ALIAS }}
          TUXUNGO_KEY_PASSWORD: ${{ secrets.TUXUNGO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signature and report
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          ls -la "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -8

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxungo-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
