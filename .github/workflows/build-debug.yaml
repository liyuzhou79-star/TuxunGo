name: Build Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout KataGo v1.15.3
        uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: v1.15.3
          path: katago-src

      - name: Install Eigen headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Build KataGo engine for Android arm64
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          EIGEN_DIR=$(dirname "$(find /usr -name 'Eigen3Config.cmake' | head -1)")
          cd katago-src/cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_BACKEND=EIGEN \
            -DUSE_OPENSSL=OFF \
            -DNO_GIT_REVISION=ON \
            -DCMAKE_C_FLAGS="-DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DCMAKE_CXX_FLAGS="-DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DEigen3_DIR="$EIGEN_DIR"
          cmake --build build-android -j"$(nproc)"
          ls -la build-android/katago
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" build-android/katago
          echo "After strip:"
          ls -la build-android/katago
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp build-android/katago "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkatago.so"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkatago.so" || true

      - name: Fetch bundled default model (kata1 b10c128, strongest 10-block net)
        run: |
          cd "$RUNNER_TEMP"
          curl -sL -o default.txt.gz "https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b10c128-s1141046784-d204142634.txt.gz"
          ls -la default.txt.gz
          file default.txt.gz
          gzip -t default.txt.gz
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/models"
          cp default.txt.gz "$GITHUB_WORKSPACE/app/src/main/assets/models/default.txt.gz"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK size
        run: ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxungo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
