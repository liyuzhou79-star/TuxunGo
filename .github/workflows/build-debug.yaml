name: Build Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Restore cached KataGo engine
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine-cache/libkatago.so
          key: katago-v1.15.3-eigen-arm64-v1

      - name: Checkout KataGo v1.15.3
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: lightvector/KataGo
          ref: v1.15.3
          path: katago-src

      - name: Install Eigen headers
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libeigen3-dev

      - name: Build KataGo engine for Android arm64
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          EIGEN_DIR=$(dirname "$(find /usr -name 'Eigen3Config.cmake' | head -1)")
          cd katago-src/cpp
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_BACKEND=EIGEN \
            -DUSE_OPENSSL=OFF \
            -DNO_GIT_REVISION=ON \
            -DCMAKE_C_FLAGS="-DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DCMAKE_CXX_FLAGS="-DBYTE_ORDER=1234 -DLITTLE_ENDIAN=1234 -DBIG_ENDIAN=4321" \
            -DEigen3_DIR="$EIGEN_DIR"
          cmake --build build-android -j"$(nproc)"
          ls -la build-android/katago
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" build-android/katago
          echo "After strip:"
          ls -la build-android/katago
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp build-android/katago "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkatago.so"
          mkdir -p "$GITHUB_WORKSPACE/engine-cache"
          cp build-android/katago "$GITHUB_WORKSPACE/engine-cache/libkatago.so"
          file "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libkatago.so" || true

      - name: Place cached engine binary
        if: steps.engine-cache.outputs.cache-hit == 'true'
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp engine-cache/libkatago.so app/src/main/jniLibs/arm64-v8a/libkatago.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Fetch bundled default model (kata1 b10c128, strongest 10-block net)
        run: |
          cd "$RUNNER_TEMP"
          curl -sL -o default.txt.gz "https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b10c128-s1141046784-d204142634.txt.gz"
          ls -la default.txt.gz
          file default.txt.gz
          gzip -t default.txt.gz
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/models"
          cp default.txt.gz "$GITHUB_WORKSPACE/app/src/main/assets/models/default.model"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK size
        run: ls -la app/build/outputs/apk/debug/

      - name: Verify APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | head -5
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "certificate SHA-256 digest" | awk '{print $NF}')
          EXPECTED="06ffef1ef532d569ec2f9a178c5638ab7cdf57309d98783b91946c79ed87a6a6"
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Test signing pin did not take effect"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxungo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
